[package]
name = "vinary-tree-js-runtime"
version = "4.0.0-rc.6"
edition = "2021"
rust-version = "1.95"
license-file = "../LICENSE"
repository = "https://github.com/vinary-tree/javascript-runtime"
description = "A single-instance native, WebAssembly, and WASI runtime that lets Vinary Tree JavaScript packages safely share live dictionaries and weighted automata."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
liblevenshtein = { version = "=4.0.0-rc.6", features = ["bindings-phonetic"] }
libdictenstein = { version = "=4.0.0-rc.6", features = ["bindings-core"] }
lling-llang = { version = "=4.0.0-rc.6", default-features = false, features = ["bindings-core"] }
duallity = { version = "=4.0.0-rc.6", features = ["bindings-core"] }
vinary-tree-interop = "=4.0.0-rc.6"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
console_error_panic_hook = "0.1"

[features]
default = ["browser"]
browser = []
wasi = ["libdictenstein/persistent-artrie", "liblevenshtein/serialization"]
